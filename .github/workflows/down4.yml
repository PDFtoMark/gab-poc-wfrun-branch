name: Release NoFilter
permissions:
  contents: write
  id-token: write
on:
  workflow_run:
    workflows: ["Test"]

    types: [completed]
jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: provenance
        run: |
          echo "DOWNSTREAM_NOFILTER_RAN=true"
          echo "trigger_event=${{ github.event.workflow_run.event }}"
          echo "trigger_head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "trigger_head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "trigger_head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "env_sha=${{ github.sha }}"
          echo "env_ref=${{ github.ref }}"
          echo "local_head=$(git rev-parse HEAD)"
          echo "marker=$(cat marker.txt)"
          echo "listing:"; ls
